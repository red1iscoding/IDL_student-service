services:
  - type: web
    name: student-service
    env: docker
    dockerfile: Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: student-db
          property: connectionString
    healthCheckPath: /api/students

databases:
  - name: student-db
    databaseName: student_db
    user: student_user
    plan: free
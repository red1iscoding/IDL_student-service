# Production Configuration
spring.application.name=student-service

# Server Port (Render will set this automatically)
server.port=${PORT:8081}

# PostgreSQL Configuration (Render will inject the connection string)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# CORS for production - update with your frontend URL
spring.web.cors.allowed-origins=${ALLOWED_ORIGINS:https://your-frontend-app.onrender.com}

# Production logging
logging.level.com.student_service.studentservice=INFO
logging.level.org.springframework.web=WARN